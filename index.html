/* ---- frame-rate governor ------------------------------------------------------------------------------------
   Frosted-glass blur and the drifting canvases are the costly parts of the show. If frames are consistently
   slow (old integrated graphics, remote desktops, software rendering) they are switched off once, so the
   animations themselves stay smooth. Everything can be turned back on in Settings → Motion. */

  /* median frame time in ms over ~2 s of animation frames (0 = could not tell) */
  measure() {
    return new Promise(res => {
      const ds = []; let last = 0; const t0 = performance.now();
      const tick = now => {

        if (ds.length < 120 && now - t0 < 12000) requestAnimationFrame(tick); else { ds.sort((a, b) => a - b); res(ds.length >= 40 ? ds[ds.length >> 1] : 0); }
      };
      requestAnimationFrame(tick);
    });
  },
  lighten() { DB.setting('fx.glass', false); DB.setting('fx.dust', false); Mo.apply(); },
  async auto() {
    if (S.settings.perfChecked || !Mo.on) return;
    await sleep(3800); if (S.settings.perfChecked) return;
    const med = await this.measure(); if (!med) return; DB.setting('perfChecked', true);
    if (med > 45 && S.settings.fx.glass) {
      this.lighten();
      Toast.show('Frames were running slowly on this machine, so frosted-glass blur and drifting dust are off to keep the animations smooth. You can switch them back on in Settings → Motion.', { icon: 'zap', ms: 14000, action: { label: 'Settings', onClick: () => openSettings('motion') } });
    }
  }
};

/* ---- keyboard shortcuts ------------------------------------------------------------------------------------ */
function installShortcuts() {
  document.addEventListener('keydown', e => {
    const mod = isMac ? e.metaKey : e.ctrlKey, k = e.key, code = e.code;
    if (Lock.active) return;
    if (mod && !e.shiftKey && !e.altKey && (k === 'k' || k === 'K')) { e.preventDefault(); Palette.open(); return; }
    if (mod && !e.altKey && k === ',') { e.preventDefault(); openSettings(); return; }
    if (mod && !e.altKey && k === '\\') { e.preventDefault(); App.toggleSide(); return; }
    if (mod && e.shiftKey && (k === 'L' || k === 'l') && S.settings.passcode) { e.preventDefault(); Lock.lockNow(); return; }
    if (e.altKey && !mod) {
      const go = p => { e.preventDefault(); Router.go(p); };
      if (code === 'Digit1') return go('/home'); if (code === 'Digit2') return go('/journals'); if (code === 'Digit3') return go('/notes'); if (code === 'Digit4') return go('/calendar'); if (code === 'Digit5') return go('/graph'); if (code === 'Digit6') return go('/search');
      if (code === 'KeyN') { e.preventDefault(); createNote(); return; } if (code === 'KeyJ') { e.preventDefault(); e.shiftKey ? openJournalEditor() : createEntry(S.settings.lastJournal); return; }
      if (code === 'KeyT') { e.preventDefault(); toggleNight(null); return; }
    }
    if (k === '?' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName) && !document.activeElement.isContentEditable) { openSettings('shortcuts'); }
  });
}

      if (st.first) { st.first = false; resize(); fit(false); st.nodes.forEach(n => { n.born = performance.now(); n.appear = 0; }); if (Mo.on) { st.tc.k = st.cam.k; st.cam.k *= .5; } }
      requestAnimationFrame(frame);
      if (Mo.on) { fx(search, 'left', { dur: 800, delay: 200 }); fx(panelBtn, 'pop', { dur: 700, delay: 350, ease: EASE.spring }); fx(dock, 'rise', { dur: 900, delay: 500 }); fx(statsEl, 'rise', { dur: 800, delay: 650 }); fx(legend, 'rise', { dur: 800, delay: 750 }); }
      if (st.local) { const n = st.byId.get(st.local); if (n) { st.sel = n; applyFocus(); renderCard(); } }
      if (query.tag) { applyFocus(); }
    },
    destroy() { st.alive = false; ro.disconnect(); window.removeEventListener('keydown', onKey); this.offs.forEach(f => safe(f)); this.offs = []; }
  });
  v.el.classList.add('v-graph');

  /* ---- sizing / keys / lifecycle ------------------------------------------------------------------------------- */
  function resize() { const r = stage.getBoundingClientRect(); const w = Math.max(200, r.width), hh = Math.max(200, r.height); st.dpr = Math.min(2, window.devicePixelRatio || 1); st.w = w; st.h = hh; cv.width = Math.round(w * st.dpr); cv.height = Math.round(hh * st.dpr); cv.style.width = w + 'px'; cv.style.height = hh + 'px'; st.dirty = true; }
  const ro = new ResizeObserver(() => { resize(); }); ro.observe(stage);
  const onKey = e => {
    if (!st.alive || Lock.active || /INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName) || (document.activeElement || {}).isContentEditable || Modal.stack.length) return;
    if (e.key === 'f' || e.key === 'F') { if (e.ctrlKey || e.metaKey) return; e.preventDefault(); fit(true); } else if (e.key === 'Escape') { select(null); setHover(null); } else if (e.key === '+' || e.key === '=') zoomBy(1.3); else if (e.key === '-') zoomBy(1 / 1.3); else if (e.key === '/') { e.preventDefault(); searchIn.focus(); }
  };
  window.addEventListener('keydown', onKey);
  v.on('data', debounce(() => { if (!st.alive || st.replay) return; const sel = st.sel && st.sel.id; buildData(); st.shown = st.nodes.filter(n => n.shown); if (sel) st.sel = st.byId.get(sel) || null; renderCard(); }, 400));
  v.on('links', debounce(() => { if (!st.alive || st.replay) return; buildData(); st.shown = st.nodes.filter(n => n.shown); }, 250));
  v.on('theme', () => setTimeout(readColors, 60)); v.on('settings', k => { if (k === 'accent' || k === '*') setTimeout(readColors, 60); });
  buildData(); st.shown = st.nodes.slice(); stats();
  
  if (!st.nodes.length) {
    v.el.classList.add('g-empty'); stage.append(h('div.g-emptybox', emptyState('Nothing to connect yet', 'Write a few notes and link them with [[double brackets]] — they will grow into a web right here.', [h('button.btn.primary', { type: 'button', on: { click: () => createNote() } }, 'New note')])));
  }
  return v;
};

/* ---- boot ---------------------------------------------------------------------------------------------------------------- */
async function boot() {
  const splash = document.getElementById('splash');
  const t0 = performance.now();
  try {
    await Persist.init(); const raw = await Persist.loadAll(); DB.load(raw);
    const fresh = !S.settings.seeded && !S.journals.length && !S.notes.length && !S.entries.length;
    if (fresh) { Seed.load(true); S.settings.seeded = true; Persist.saveSettings(); }
    
    Links.rebuild(); applyAppearance(); Layer.init(); Tip.init(); Ambient.init(); Mo.apply();
    FontDetect.onDone(() => Bus.emit('fonts')); setTimeout(() => safe(() => FontDetect.run()), 400);
    App.build();
    Router.def(/^\/home$/, 'home', 0, () => Views.home());
    Router.def(/^\/journals$/, 'journals', 1, () => Views.journals());
    Router.def(/^\/journal\/([^/]+)$/, 'journal', 1.5, m => Views.journal(m[1]));
    Router.def(/^\/entry\/([^/]+)$/, 'entry', 1.7, m => Views.doc('entry', m[1]));
    Router.def(/^\/notes$/, 'notes', 2, (m, q) => Views.notes(q));
    Router.def(/^\/note\/([^/]+)$/, 'note', 2.5, m => Views.doc('note', m[1]));
    Router.def(/^\/calendar$/, 'calendar', 3, (m, q) => Views.calendar(q));
    Router.def(/^\/graph$/, 'graph', 4, (m, q) => Views.graph(q));
    Router.def(/^\/search$/, 'search', 5, (m, q) => Views.search(q));
    Router.def(/^\/trash$/, 'trash', 6, () => Views.trash());
    installShortcuts(); Lock.init();
    
    const start = async () => {
      await Router.start();
      const wait = Math.max(0, 1300 - (performance.now() - t0)); await sleep(Mo.on ? wait : 0);
      if (splash) { if (Mo.on) { splash.classList.add('leaving'); await splash.animate([{ clipPath: 'circle(150% at 50% 50%)' }, { clipPath: 'circle(0% at 50% 50%)' }], { duration: Mo.t(1150), easing: EASE.io, fill: 'forwards' }).finished.catch(() => { }); } splash.remove(); }
      document.documentElement.classList.add('ready');
      if (Mo.on) { fx($('#side'), 'left', { dur: 1000 }); fx($('#top'), 'fall', { dur: 900, delay: 150 }); cascade($$('#side .nav-item, #side .side-sec'), 'left', { gap: 55, delay: 200, dur: 800 }); const lg = $$('.brand-logo path'); lg.forEach((pth, i) => pth.animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration: Mo.t(1400), delay: Mo.t(200 + i * 200), easing: EASE.out, fill: 'backwards' })); }
      if (!S.settings.welcomed) setTimeout(welcomeModal, Mo.t(700));
      
      safe(() => Perf.auto());
      DB.purgeOld(30);
      if (Persist.mode === 'mem') Toast.show('Your browser is not letting Vellum store data here, so changes live only in this tab. Export a backup before closing.', { type: 'warn', ms: 0, icon: 'alert' });
      else if (!fresh && S.settings.welcomed && (DB.docs().length >= 8) && (!S.settings.lastBackup || Date.now() - S.settings.lastBackup > 21 * 864e5)) setTimeout(() => Toast.show('It has been a while since your last backup.', { icon: 'download', ms: 9000, action: { label: 'Back up now', onClick: () => { Data.backup(); Toast.show('Backup downloaded.', { icon: 'check' }); } } }), 6000);
    };
    if (S.settings.passcode) { if (splash) splash.classList.add('behind-lock'); Lock.show(start); } else await start();
  } catch (err) {
    console.error(err);
    if (splash) splash.remove();
    document.getElementById('app').append(h('div.boot-error', h('h1', 'Vellum could not start'), h('p', String(err && err.message || err)), h('p.hint', 'Your data has not been touched. Try reloading, or open this file in a recent Chrome, Edge, Firefox or Safari.'), h('button.btn.primary', { on: { click: () => location.reload() } }, 'Reload')));
  }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

})();
</script>
